server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # NOTE: nginx drops server-level add_header directives inside any location that defines its own,
  # so the security headers are repeated in those locations (see /assets/ and /).
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;

  # API + the pipeline's server-sent events. Response buffering is disabled here, and the API also sends
  # `X-Accel-Buffering: no`, so each pipeline step reaches the browser as it happens. (Tested against nginx 1.24:
  # events arrive 1s apart. Buffering behaviour varies by proxy and version, so both protections are kept.)
  # gzip_types deliberately excludes text/event-stream: compressing a stream would delay events.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (not append) so a visitor cannot spoof their address and dodge the rate limit.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    try_files $uri /index.html;
  }
}
